<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>習慣トラッカー</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>習慣トラッカー</h1>
      <div id="userBar" class="hidden">
        <span id="userName"></span>
        <button id="logoutBtn" class="ghost">ログアウト</button>
      </div>
    </header>

    <section id="authSection">
      <form id="authForm" class="card">
        <h2 id="authTitle">ログイン</h2>
        <label>ユーザー名<input type="text" id="username" autocomplete="username" required /></label>
        <label>パスワード<input type="password" id="password" autocomplete="current-password" required minlength="8" /></label>
        <p id="authError" class="error hidden"></p>
        <button type="submit">ログイン</button>
        <button type="button" id="toggleModeBtn" class="ghost">アカウントを作成する</button>
      </form>
    </section>

    <section id="mainSection" class="hidden">
      <form id="newHabitForm" class="card inline">
        <input type="text" id="newHabitName" placeholder="新しい習慣(例: 読書10分)" required />
        <button type="submit">追加</button>
      </form>

      <ul id="habitList"></ul>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
